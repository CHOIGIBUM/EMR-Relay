AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: EMS Relay serverless backend - API Gateway, Lambda, Bedrock Converse, DynamoDB

Parameters:
  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model ID or inference profile ID available to the account
  BedrockRegion:
    Type: String
    Default: ap-northeast-2
    Description: AWS Region used by the Bedrock Runtime client
  CorsOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:3000"
    Description: Comma-separated frontend origins allowed by the HTTP API.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref CaseTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !Ref BedrockRegion
        NODE_OPTIONS: --enable-source-maps

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: !Ref CorsOrigins
        AllowHeaders:
          - content-type
          - authorization
          - x-request-id
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handler.handler
      Description: EMS Relay API and HITL confirmation handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseTable
        - Statement:
            - Sid: InvokeConfiguredBedrockModel
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        Agent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /agent
            Method: POST
        VoiceProposal:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cases/{id}/voice-updates/proposals
            Method: POST
        Hospitals:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /hospitals
            Method: GET
        GetCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cases/{id}
            Method: GET
        ConfirmCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cases/{id}/confirm
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs

  CaseTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  CaseTableName:
    Description: DynamoDB table containing confirmed state, proposals and audit events
    Value: !Ref CaseTable
  FunctionName:
    Description: Lambda function name
    Value: !Ref ApiFunction
