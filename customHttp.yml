customHeaders:
  - pattern: "**/*"
    headers:
      - key: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://dapi.kakao.com https://t1.daumcdn.net https://*.daumcdn.net https://*.kakaocdn.net; style-src 'self' 'unsafe-inline' https://*.daumcdn.net https://*.kakaocdn.net; img-src 'self' data: blob: https://*.kakao.com https://*.daumcdn.net https://*.kakaocdn.net; font-src 'self' data:; connect-src 'self' https://rs3fmipm2ng6npugs4goywr64q.appsync-api.ap-northeast-2.amazonaws.com wss://rs3fmipm2ng6npugs4goywr64q.appsync-realtime-api.ap-northeast-2.amazonaws.com wss://transcribestreaming.ap-northeast-2.amazonaws.com:8443 https://ems-relay-v2-462993243992-ap-northeast-2.auth.ap-northeast-2.amazoncognito.com https://dapi.kakao.com https://*.kakao.com https://*.daum.net https://*.daumcdn.net https://*.kakaocdn.net; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://ems-relay-v2-462993243992-ap-northeast-2.auth.ap-northeast-2.amazoncognito.com; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=(self), payment=(), usb=()"
      - key: Cross-Origin-Opener-Policy
        value: same-origin
      - key: Cross-Origin-Resource-Policy
        value: same-origin
  - pattern: "_next/static/**/*"
    headers:
      - key: Cache-Control
        value: "public, max-age=31536000, immutable"
  - pattern: "**/*.html"
    headers:
      - key: Cache-Control
        value: "no-cache, no-store, must-revalidate"
