[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ems-relay-agentcore"
version = "0.1.0"
description = "Proposal-only LangGraph workflow for EMS Relay on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bedrock-agentcore>=1.19.0,<2.0.0",
  "langchain-aws>=1.6.4,<2.0.0",
  "langgraph>=1.2.10,<2.0.0",
  "pydantic>=2.11.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["ems_relay_agentcore*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

